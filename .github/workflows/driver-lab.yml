# nvprofileinspector.com test lab, part 2: NVIDIA driver package analysis (Windows) and NPI under Wine (Linux).
name: driver-lab
on:
  workflow_dispatch:
    inputs:
      run: { description: "run id", required: true, default: "drv-manual" }
      driver: { description: "GeForce driver version", required: true, default: "621.14" }
  push:
    paths: ["scripts/driver_lab.ps1", "scripts/linux_wine.sh", ".github/workflows/driver-lab.yml"]
permissions: { contents: write }
env:
  RUN: ${{ github.event.inputs.run || format('drv-{0}', github.run_number) }}
  DRIVER: ${{ github.event.inputs.driver || '621.14' }}
jobs:
  driver:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: driver package lab
        shell: pwsh
        run: ./scripts/driver_lab.ps1 -Run $env:RUN -Machine windows-2025 -Driver $env:DRIVER
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: res-driver, path: results/ }
  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable
          sudo apt-get install -y -qq xvfb imagemagick wmctrl x11-utils cabextract unzip mesa-vulkan-drivers
          sudo wget -qO /usr/local/bin/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks && sudo chmod +x /usr/local/bin/winetricks
      - name: wine lab
        run: bash scripts/linux_wine.sh "$RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: res-wine, path: results/ }
  commit:
    needs: [driver, wine]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: |
          mkdir -p results && for d in art/*/; do cp -r "$d"* results/; done
          find results -name '*.exe' -o -name '*.dll' | xargs rm -f
          git config user.name "npi-lab"; git config user.email "lab@users.noreply.github.com"
          git add results && git commit -m "driver lab results $RUN" && git pull --rebase && git push || echo "nothing to commit"
